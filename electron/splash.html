<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaraTool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, rgba(244, 63, 94, 0.14), rgba(15, 23, 42, 0.98) 68%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 24px 48px rgba(2, 6, 23, 0.65);
      animation: fadeIn 0.28s ease-out;
    }

    .logo-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      filter: drop-shadow(0 12px 24px rgba(244, 63, 94, 0.22));
      animation: floatPulse 2.4s ease-in-out infinite;
    }

    .logo-wrap svg {
      width: 100%;
      height: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .brand-title {
      color: #f8fafc;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fb7185;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.28);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .status-text {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .progress-track {
      width: 150px;
      height: 3px;
      background: rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f43f5e, #10b981);
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes floatPulse {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes slide {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(260%);
      }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="24" fill="#0F172A"/>
        <rect x="2" y="2" width="96" height="96" rx="22" stroke="#F43F5E" stroke-width="2" stroke-opacity="0.35"/>
        <path d="M30 25 V75 H70" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="70" cy="40" r="8" fill="#10B981"/>
      </svg>
    </div>
    <div class="brand">
      <span class="brand-title">LaraTool</span>
      <span class="brand-badge">PRO</span>
    </div>
    <div class="status-text">Starting environment...</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
